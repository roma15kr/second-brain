# Which AI plays which role in ./scripts/factory.sh. Options: claude | codex | gemini | opencode
# The reviewer must differ from the builder; if it is the same or missing, the script picks
# the first other installed agent from AGENT_FALLBACK_ORDER.
SCOUT_AGENT=gemini      # reads a lot of text cheaply (large context)
PLANNER_AGENT=claude
BUILDER_AGENT=claude
REVIEWER_AGENT=codex    # a different model catches different mistakes
LEARNER_AGENT=claude
AGENT_FALLBACK_ORDER="claude codex gemini opencode"

# Branch that worktrees start from and merge back into (default: current branch)
# BASE_BRANCH=main

# Extra shell commands Claude may run in "safe" roles (scout, planner, learner), space-separated.
# Example: CLAUDE_ALLOWED_TOOLS='Bash(npm test:*) Bash(ls:*)'
CLAUDE_ALLOWED_TOOLS=''
