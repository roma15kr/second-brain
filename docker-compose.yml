# Deployed as a Coolify "Docker Compose" application.
# SERVICE_PASSWORD_* variables are generated by Coolify; set the rest in its Environment Variables.
x-kb: &kb
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
    KB_CONFIG_YAML: ${KB_CONFIG_YAML}
    IMAP_USER_MAIN: ${IMAP_USER_MAIN:-}
    IMAP_PASSWORD_MAIN: ${IMAP_PASSWORD_MAIN:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    KB_DISTILL_MODEL: ${KB_DISTILL_MODEL:-}
    KB_SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}  # decrypts credentials connected in the web OS

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_DB: kb
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - kb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - kb-backups:/backups
      - kb-audio:/data/audio:ro  # copied incrementally to /backups/audio

  ingest:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb ingest"]

  telegram:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb ingest-telegram"]
    environment:
      DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
      KB_CONFIG_YAML: ${KB_CONFIG_YAML}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      # The session file is equivalent to account access: own volume, never in backups of the app.
      - kb-telegram:/data/telegram

  index:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb index"]
    volumes:
      - kb-models:/models  # embedding model (~2 GB), downloaded once

  mcp:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb mcp --port 8765"]
    volumes:
      - kb-models:/models
    environment:
      DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
      KB_CONFIG_YAML: ${KB_CONFIG_YAML}
      KB_MCP_TOKEN: ${SERVICE_PASSWORD_64_MCPTOKEN}
    # No published ports: Coolify's proxy routes the assigned domain (HTTPS) to port 8765,
    # and every request must carry KB_MCP_TOKEN. Move to Tailscale-only per ADR 0009.
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  routines:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb routines"]
    volumes:
      - kb-dictations:/data/dictations  # retries failed transcriptions
      - kb-audio:/data/audio  # deletes audio after 12 months
    environment:
      DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
      KB_CONFIG_YAML: ${KB_CONFIG_YAML}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KB_DISTILL_MODEL: ${KB_DISTILL_MODEL:-}
      KB_SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
      # reply drafts use the same search as the web OS (models live in the mcp service)
      KB_SEARCH_URL: http://mcp:8765/internal/search
      KB_MCP_TOKEN: ${SERVICE_PASSWORD_64_MCPTOKEN}
      # approved replies are saved to the mailbox's Drafts from here (assistant-actions)
      IMAP_USER_MAIN: ${IMAP_USER_MAIN:-}
      IMAP_PASSWORD_MAIN: ${IMAP_PASSWORD_MAIN:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}

  web:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb web --port 8001"]
    volumes:
      # dictation audio until it is transcribed (deleted then; failed ones after 7 days)
      - kb-dictations:/data/dictations
      # meeting audio from the recorder apps, 12 months (ADR 0010 amendment)
      - kb-audio:/data/audio
    environment:
      DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
      KB_CONFIG_YAML: ${KB_CONFIG_YAML}
      KB_WEB_ORIGIN: ${KB_WEB_ORIGIN:-}
      # the assistant answers requests from the web OS (assistant-requests)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KB_DISTILL_MODEL: ${KB_DISTILL_MODEL:-}
      KB_SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
      # search runs in the mcp service, which holds the embedding/reranking models
      KB_SEARCH_URL: http://mcp:8765/internal/search
      KB_MCP_TOKEN: ${SERVICE_PASSWORD_64_MCPTOKEN}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
    # Coolify's proxy routes the web OS domain (HTTPS) to port 8001; every data route needs a
    # passkey session (web-access spec).
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  kb-postgres:
  kb-telegram:
  kb-models:
  kb-dictations:
  kb-audio:
  kb-backups:
