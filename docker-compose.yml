# Deployed as a Coolify "Docker Compose" application.
# SERVICE_PASSWORD_* variables are generated by Coolify; set the rest in its Environment Variables.
x-kb: &kb
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
    KB_CONFIG_YAML: ${KB_CONFIG_YAML}
    IMAP_USER_MAIN: ${IMAP_USER_MAIN:-}
    IMAP_PASSWORD_MAIN: ${IMAP_PASSWORD_MAIN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_DB: kb
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - kb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb ingest"]

  index:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb index"]

  mcp:
    <<: *kb
    command: ["sh", "-c", "kb migrate && exec kb mcp --port 8765"]
    environment:
      DATABASE_URL: postgresql://kb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kb
      KB_CONFIG_YAML: ${KB_CONFIG_YAML}
      KB_MCP_TOKEN: ${SERVICE_PASSWORD_64_MCPTOKEN}
    ports:
      # Private by default: bind to the server's loopback or Tailscale IP, never 0.0.0.0.
      - "${MCP_BIND:-127.0.0.1}:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  kb-postgres:
