[project]
name = "kb"
version = "0.1.0"
description = "second-brain: personal knowledge base (mail, Telegram, ...) with hybrid search over MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "imapclient>=3.0",
    "mcp>=1.9",
    "uvicorn>=0.30",
    "telethon>=1.36",
    "qrcode>=7.4",
    "openai>=2",
    "fastembed>=0.7",
    "fastapi>=0.143.5",
    "webauthn>=3.0.1",
    "tzdata>=2026.5",
    "pywebpush>=2.5.0",
    "cryptography>=50.0.2",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[project.scripts]
kb = "kb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pgserver>=0.1.4",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models or large data"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "openspec", ".claude", ".agents", ".gemini", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
