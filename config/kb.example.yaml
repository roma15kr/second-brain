# Copy to config/kb.yaml for local runs, or paste into the KB_CONFIG_YAML env var in Coolify.
# No secrets here: credentials are read from the environment variables named below.
sources:
  - id: mail-main
    type: imap
    scopes: [digisoft]            # personal | digisoft | quokka | rdim
    host: imap.zoho.eu
    port: 993
    username_env: IMAP_USER_MAIN
    password_env: IMAP_PASSWORD_MAIN
    # folders: [INBOX]          # omit to discover: Gmail → All Mail, others → all but junk/trash
    exclude_folders: []
    poll_seconds: 60
    backfill_days: 365

  - id: telegram
    type: telegram
    scopes: [personal]            # default for chats without their own scopes
    api_id_env: TELEGRAM_API_ID   # from my.telegram.org
    api_hash_env: TELEGRAM_API_HASH
    session_path: /data/telegram/kb.session   # created by `kb auth telegram`
    backfill_days: 365
    chats:                        # allowlist; ids from `kb telegram chats`
      - chat: -1001234567890
        scopes: [quokka]
      - chat: "@some_username"
